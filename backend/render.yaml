services:
  - type: web
    name: icap-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icap-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: icap-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app   # UPDATE after Vercel deploy
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-credentials.json
      - key: MONGODB_URL
        sync: false   # Set manually from MongoDB Atlas
      - key: GEMINI_API_KEY
        sync: false   # Set manually
    secretFiles:
      - name: firebase-credentials.json
        mountPath: /etc/secrets/firebase-credentials.json
    buildFilter:
      paths:
        - backend/**
    preDeployCommand: alembic upgrade head

databases:
  - name: icap-postgres
    plan: free
    region: oregon

  - name: icap-redis
    type: redis
    plan: free
    region: oregon
